html{font-size:17px;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;line-height:1.45;}
h1,h2,h3,.brand,button{font-family:'Poppins',sans-serif;}
#app{width:100%;max-width:440px;min-height:100vh;background:var(--card);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(17,24,39,0.06);}

.item-thumb{width:68px;height:68px;border-radius:16px;background:var(--bg);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}

label{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;display:block;margin-top:16px;}

button.primary{

.msg-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}

.msg-input-row{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:8px;}

.conv-card{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:20px;margin-bottom:12px;cursor:pointer;background:var(--card);box-shadow:0 2px 10px rgba(17,24,39,0.04);}
.streak-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,rgba(14,165,233,0.14),rgba(34,197,94,0.14));margin-bottom:18px;animation:fadeSlideIn .35s ease both;}

.skeleton{height:68px;border-radius:20px;margin-bottom:14px;background:linear-gradient(90deg,#f0f0f0 25%,#f8f8f8 37%,#f0f0f0 63%);background-size:400px 100%;animation:shimmer 1.4s infinite linear;}
.city-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
.view-toggle{display:flex;gap:6px;margin-bottom:16px;}
.view-toggle button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;}
.view-toggle button.active{background:var(--gradient);color:#fff;border-color:transparent;}
#mapView{height:60vh;border-radius:16px;overflow:hidden;border:1px solid var(--border);}
#itemMiniMap{height:160px;border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-top:12px;}
.locate-btn{width:auto;margin-top:8px;padding:10px 14px;font-size:13px;background:none;border:1px solid var(--border);border-radius:12px;color:var(--accent);font-weight:700;cursor:pointer;}
.city-scroll::-webkit-scrollbar{display:none;}
.city-chip{
  flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 16px;min-width:110px;
  box-shadow:0 2px 8px rgba(17,24,39,0.04);animation:fadeSlideIn .35s ease both;
}
.city-chip .city-name{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;}
.city-chip .city-count{font-size:19px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent;}
.account-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
.account-avatar{width:64px;height:64px;border-radius:50%;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;}
.account-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);font-size:15px;}
.account-row span.lbl{color:var(--muted);}
</style>

<body>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://hyvlfpebkdqeutrdredk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wGxofUWNRjzma7YOTpCC_g_ZHnotE7k';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  screen: 'search',
  pendingScreen: null,
  user: null,
  items: [],
  favorites: [],
  filterCategory: '',
  filterSubcategory: '',
  filterStatus: '',
  filterSize: '',
  filterShoeSize: '',
  searchQuery: '',
  currentItemId: null,
  loading: false,
  favCounts: {},
  blockedUsers: [],
  viewMode: 'list',
};

const GATED_SCREENS = ['favorites','create','conversations','account','chat','edit','boost'];

const NEIGHBOURHOODS = [
  'Queenstown CBD','Fernhill','Sunshine Bay','Kelvin Heights','Frankton','Arthurs Point',
  'Arrowtown','Lake Hayes','Shotover Country','Jacks Point','Queenstown Hill',
  'Wanaka','Albert Town','Hawea','Cardrona',
  'Glenorchy','Kingston','Cromwell','Alexandra',
  'Christchurch','Dunedin','Other South Island town'
];
const CATEGORIES = [
  'Sport & Outdoor',
  'DIY & Tools',
  'Home & Garden',
  'Electronics',
  'Fashion & Accessories',
  'Kids & Baby',
  'Kitchen & Appliances',
  'Hobbies & Games',
  'Other'
];
const SUBCATEGORIES = {
  'Sport & Outdoor': ['Skiing & Snowboarding','Cycling','Camping & Hiking','Water sports','Fitness & Gym','Team sports','Other'],
  'DIY & Tools': ['Power tools','Hand tools','Ladders & Scaffolding','Garden tools','Other'],
  'Home & Garden': ['Furniture','Decoration','Garden & Outdoor','Lighting','Other'],
  'Electronics': ['Phones & Tablets','Computers & Laptops','TV & Audio','Gaming','Cameras','Other'],
  'Fashion & Accessories': ["Women's clothing","Men's clothing","Kids' clothing",'Shoes','Bags & Accessories','Jewellery & Watches'],
  'Kids & Baby': ['Toys','Baby gear (strollers, car seats)','Kids clothing','Books & Games','Other'],
  'Kitchen & Appliances': ['Small appliances','Large appliances','Cookware','Tableware','Other'],
  'Hobbies & Games': ['Board games','Books','Musical instruments','Collectibles','Video games','Other'],
  'Other': []
};
const STATUSES = [
  {v:'vendre', label:'For sale', cls:'vendre'},
  {v:'louer', label:'For rent', cls:'louer'},
  {v:'preter', label:'Free to borrow', cls:'preter'}
];
const CLOTHING_SIZES = ['XS','S','M','L','XL','XXL'];
const SHOE_SIZES = Array.from({length:14}, (_,i)=> 34+i);
const BOOST_OPTIONS = [
  {days:1, label:'1 day', price:3},
  {days:7, label:'1 week', price:8},
  {days:30, label:'1 month', price:20}
];

// Lightweight scam/spam keyword filter — blocks obvious red flags before publishing or messaging.
// Not a substitute for the Report button, just a first line of defence.
const BLOCKED_KEYWORDS = [
  'wire transfer','western union','moneygram','bitcoin only','crypto payment only',
  'gift card','send gift cards','whatsapp me at','telegram me at','click this link',
  'verify your account','urgent payment required','prepay before pickup'
];
function containsBlockedContent(text){
  const lower = (text||'').toLowerCase();
  return BLOCKED_KEYWORDS.some(k => lower.includes(k));
}

async function loadItems(){
  state.loading = true;
  try{
    const { data, error } = await db.from('items').select('*').order('created_at', { ascending: false });
    if(error) throw error;
    state.items = (data || []).map(rowToItem);
  }catch(e){ state.items = []; console.error('loadItems', e); }
  state.loading = false;
  await loadFavorites();
  await loadBlockedUsers();
  render();
}
function rowToItem(row){
  return {
    id: row.id, title: row.title, description: row.description, category: row.category,
    subcategory: row.subcategory, status: row.status, price: row.price, neighborhood: row.neighborhood,
    size: row.size, shoeSize: row.shoe_size, photo: row.photo,
    postedBy: row.posted_by, postedByEmail: row.posted_by_email, createdAt: row.created_at,
    editCount: row.edit_count || 0, boostedUntil: row.boosted_until, views: row.views || 0,
    availability: row.availability || 'available', lat: row.latitude, lng: row.longitude
  };
}
async function saveItem(item){
  const { error } = await db.from('items').insert([{
    id: item.id, title: item.title, description: item.description, category: item.category,
    subcategory: item.subcategory, status: item.status, price: item.price, neighborhood: item.neighborhood,
    size: item.size, shoe_size: item.shoeSize, photo: item.photo,
    posted_by: item.postedBy, posted_by_email: state.user.email, created_at: item.createdAt,
    availability: 'available', latitude: item.lat || null, longitude: item.lng || null
  }]);
  if(error) console.error('saveItem', error);
}
async function updateItem(id, fields, newEditCount){
  const { error } = await db.from('items').update({
    title: fields.title, description: fields.description, category: fields.category,
    subcategory: fields.subcategory, status: fields.status, price: fields.price,
    neighborhood: fields.neighborhood, size: fields.size, shoe_size: fields.shoeSize,
    photo: fields.photo, edit_count: newEditCount,
    latitude: fields.lat || null, longitude: fields.lng || null
  }).eq('id', id);
  if(error) console.error('updateItem', error);
}
async function setAvailability(id, availability){
  const { error } = await db.from('items').update({ availability }).eq('id', id);
  if(error){ console.error('setAvailability', error); return; }
  const item = state.items.find(i=>i.id===id);
  if(item) item.availability = availability;
  render();
}

async function loadFavorites(){
  if(!state.user){ state.favorites = []; return; }
  try{
    const { data, error } = await db.from('favorites').select('item_id').eq('user_email', state.user.email);
    if(error) throw error;
    state.favorites = (data || []).map(r => r.item_id);
  }catch(e){ state.favorites = []; console.error('loadFavorites', e); }
}
async function toggleFavorite(itemId, evt){
  if(evt) evt.stopPropagation();
  if(!state.user){ requireAuth('search'); return; }
  if(state.favorites.includes(itemId)){
    await db.from('favorites').delete().eq('user_email', state.user.email).eq('item_id', itemId);
    state.favorites = state.favorites.filter(id => id !== itemId);
  } else {
    await db.from('favorites').insert([{ user_email: state.user.email, item_id: itemId }]);
    state.favorites.push(itemId);
  }
  render();
}

async function loadMessages(itemId){
  try{
    const { data, error } = await db.from('messages').select('*').eq('item_id', itemId).order('created_at', { ascending: true });
    if(error) throw error;
    return (data || []).map(r => ({ id: r.id, itemId: r.item_id, from: r.from_name, text: r.text, createdAt: r.created_at }));
  }catch(e){ console.error('loadMessages', e); return []; }
}
async function sendMessage(itemId, from, text){
  const msg = { id:'m_'+Date.now(), item_id: itemId, from_name: from, text, created_at: Date.now() };
  const { error } = await db.from('messages').insert([msg]);
  if(error) console.error('sendMessage', error);
  return msg;
}

function statusInfo(v){ return STATUSES.find(s=>s.v===v) || STATUSES[0]; }

const ICON_SEARCH = `<svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="#0EA5E9" stroke-width="2.4"/><line x1="15.3" y1="15.3" x2="21" y2="21" stroke="#0EA5E9" stroke-width="2.6" stroke-linecap="round"/></svg>`;

const ICON_CLOVER = `<svg class="nav-icon-svg" viewBox="0 0 24 24" fill="#1fdf7c"><path d="M12 12c0-2.8-2.2-5-5-5s-5 2.2-5 5 2.2 5 5 5c0-2.8 2.2-5 5-5z"/><path d="M12 12c0-2.8 2.2-5 5-5s5 2.2 5 5-2.2 5-5 5c0-2.8-2.2-5-5-5z"/><path d="M12 12c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5c-2.8 0-5 2.2-5 5z"/><path d="M12 12c2.8 0 5 2.2 5 5s-2.2 5-5 5-5-2.2-5-5c2.8 0 5-2.2 5-5z"/><rect x="11" y="12" width="2" height="8" rx="1"/></svg>`;

const ICON_MESSAGE = `<svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="msgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#22C55E"/></linearGradient></defs><rect x="2.5" y="5" width="19" height="14" rx="4" stroke="url(#msgGrad)" stroke-width="2"/><path d="M4 7l8 6 8-6" stroke="url(#msgGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M16.5 15c-1.2 0-2-.9-2-2.1 0-1.6 2-2.9 2-2.9s2 1.3 2 2.9c0 1.2-.8 2.1-2 2.1z" fill="url(#msgGrad)"/></svg>`;

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'login' || state.screen === 'signup'){
    app.innerHTML = authScreen();
    bindAuth();
    return;
  }
  app.innerHTML = `
    ${screenHeader()}
    <main id="mainContent" style="animation:fadeSlideIn .3s ease both;">${screenContent()}</main>
    <nav class="bottom">
      <button class="${state.screen==='search'?'active':''}" onclick="goto('search')" aria-label="Search">${ICON_SEARCH}</button>

async function requestPasswordReset(){
  const email = document.getElementById('f-email').value.trim();
  const errBox = document.getElementById('authError');
  const noticeBox = document.getElementById('authNotice');
  errBox.style.display = 'none'; noticeBox.style.display = 'none';
  if(!email){
    errBox.textContent = 'Type your email above first, then click "Forgot your password?" again.';
    errBox.style.display = 'block';
    return;
  }
  const siteUrl = window.location.origin + window.location.pathname;
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: siteUrl });
  if(error){ errBox.textContent = error.message; errBox.style.display = 'block'; return; }
  noticeBox.textContent = 'Check your email for a link to reset your password.';
  noticeBox.style.display = 'block';
}
function switchAuth(mode){ state.screen = mode; render(); }
function bindAuth(){
  document.getElementById('authForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errBox = document.getElementById('authError');
    const noticeBox = document.getElementById('authNotice');
    const btn = document.getElementById('authSubmitBtn');
    errBox.style.display = 'none';
    noticeBox.style.display = 'none';
    const email = document.getElementById('f-email').value.trim();
    const password = document.getElementById('f-pass').value;
    btn.disabled = true;
    btn.textContent = 'Please wait...';

    if(state.screen === 'signup'){
      const name = document.getElementById('f-name').value.trim();
      const hood = document.getElementById('f-hood').value.trim();
      const { data, error } = await db.auth.signUp({
        email, password,
        options: { data: { name, neighborhood: hood } }
      });
      btn.disabled = false; btn.textContent = 'Sign up';
      if(error){ errBox.textContent = error.message; errBox.style.display = 'block'; return; }
      if(!data.session){
        noticeBox.textContent = 'Check your email to confirm your account, then log in.';
        noticeBox.style.display = 'block';
        switchAuth('login');
        return;
      }
      state.user = { name, email, neighborhood: hood };
      if(state.referralCode && state.referralCode !== email){
        db.from('referrals').insert([{ referrer_email: state.referralCode, referred_email: email }]).then(()=>{});
      }
      afterAuthSuccess();
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      btn.disabled = false; btn.textContent = 'Log in';
      if(error){ errBox.textContent = error.message; errBox.style.display = 'block'; return; }
      const meta = data.user.user_metadata || {};
      state.user = { name: meta.name || email.split('@')[0], email, neighborhood: meta.neighborhood || 'Queenstown', phone: meta.phone || '' };
      afterAuthSuccess();
    }
  });
}

function filteredItems(){
  const q = state.searchQuery.trim().toLowerCase();
  const blocked = state.blockedUsers || [];
  const list = state.items.filter(i =>
    !blocked.includes(i.postedBy) &&
    (!state.filterCategory || i.category === state.filterCategory) &&
    (!state.filterSubcategory || i.subcategory === state.filterSubcategory) &&
    (!state.filterStatus || i.status === state.filterStatus) &&
    (!state.filterSize || i.size === state.filterSize) &&
    (!state.filterShoeSize || String(i.shoeSize) === String(state.filterShoeSize)) &&
    (!q || i.title.toLowerCase().includes(q) || (i.description||'').toLowerCase().includes(q))
  );
  const now = Date.now();
  return list.sort((a,b) => {
    const aBoost = a.boostedUntil && a.boostedUntil > now ? 1 : 0;
    const bBoost = b.boostedUntil && b.boostedUntil > now ? 1 : 0;
    if(aBoost !== bBoost) return bBoost - aBoost;
    return b.createdAt - a.createdAt;
  });
}

function cityBreakdown(){
  const counts = {};
  state.items.forEach(i => {
    const city = (i.neighborhood || 'Other').trim();
    counts[city] = (counts[city] || 0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}

// Resizes and compresses an image before storage (avoids overly heavy files)
function processAndUploadPhoto(file, maxWidth){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const previewDataUrl = canvas.toDataURL('image/jpeg', 0.72);
        canvas.toBlob(async (blob) => {
          try{
            const filename = `photo_${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
            const { error: upErr } = await db.storage.from('listing-photos').upload(filename, blob, { contentType: 'image/jpeg', upsert: true });
            if(upErr) throw upErr;
            const { data } = db.storage.from('listing-photos').getPublicUrl(filename);
            resolve({ previewDataUrl, url: data.publicUrl });
          }catch(err){ reject(err); }
        }, 'image/jpeg', 0.72);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function shareListing(itemId){
  const item = state.items.find(i=>i.id===itemId);
  if(!item) return;
  const url = window.location.origin + window.location.pathname + '?item=' + itemId;
  const shareData = {
    title: item.title,
    text: `Check out "${item.title}" on KohaLoop — ${item.neighborhood}`,
    url
  };
  if(navigator.share){
    try{ await navigator.share(shareData); }catch(e){ /* user cancelled, do nothing */ }
  } else {
    try{
      await navigator.clipboard.writeText(url);
      alert('Link copied! Paste it anywhere to share this listing.');
    }catch(e){
      prompt('Copy this link to share:', url);
    }
  }
}

async function loadAndRenderBookings(itemId){
  const list = document.getElementById('bookingsList');
  if(!list) return;
  try{
    const { data, error } = await db.from('bookings').select('*').eq('item_id', itemId).order('start_date');
    if(error) throw error;
    const today = new Date().toISOString().slice(0,10);
    const upcoming = (data||[]).filter(b => b.end_date >= today);
    const item = state.items.find(i=>i.id===itemId);

    list.innerHTML = upcoming.length ? upcoming.map(b => `

  }catch(e){
    list.innerHTML = `<p style="color:var(--muted);font-size:13px;">Could not load booked dates.</p>`;
    console.error('loadAndRenderBookings', e);

async function startCheckout(kind, itemId, days, price){
  const siteUrl = window.location.origin + window.location.pathname;
  try{
    const res = await fetch('/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ itemId, kind, days, price, siteUrl })
    });
    if(!res.ok){
      const text = await res.text();
      alert('Payment service error (' + res.status + '): ' + text.slice(0,200));
      console.error('checkout error', res.status, text);
      return;
    }
    const data = await res.json();
    if(data.url){
      window.location.href = data.url;
    } else {
      alert('Could not start checkout: ' + (data.error || 'unknown error'));
    }
  }catch(e){
    alert('Could not reach the payment service. Please try again.');
    console.error(e);
  }
}

async function handleCheckoutReturn(){
  const params = new URLSearchParams(window.location.search);
  const boostItem = params.get('boost_success');
  const editItem = params.get('edit_success');
  const cancelled = params.get('payment_cancelled');
  if(boostItem){
    const days = parseInt(params.get('days'), 10) || 1;
    const boostedUntil = Date.now() + days*24*60*60*1000;
    await db.from('items').update({ boosted_until: boostedUntil }).eq('id', boostItem);
    window.history.replaceState({}, '', window.location.pathname);
    await loadItems();
    state.currentItemId = boostItem;
    state.screen = 'detail';
    render();
    alert('Payment successful — your listing is now boosted!');
  } else if(editItem){
    await db.from('items').update({ edit_count: 0 }).eq('id', editItem);
    window.history.replaceState({}, '', window.location.pathname);
    await loadItems();
    openEdit(editItem);
    alert('Payment successful — you can now edit your listing again.');
  } else if(cancelled){
    window.history.replaceState({}, '', window.location.pathname);
  }
}

function bindScreenEvents(){
  const bookingForm = document.getElementById('bookingForm');
  if(bookingForm){
    bookingForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const start = document.getElementById('bk-start').value;
      const end = document.getElementById('bk-end').value;
      if(!start || !end || end < start){ alert('Please pick a valid date range (end date after start date).'); return; }
      const { data: existing, error: fetchErr } = await db.from('bookings').select('start_date,end_date').eq('item_id', state.currentItemId);
      if(fetchErr){ alert('Could not check existing dates. Please try again.'); return; }
      const overlaps = (existing||[]).some(b => start <= b.end_date && end >= b.start_date);
      if(overlaps){
        alert('These dates overlap with an existing booking. Please pick a different range, or remove the conflicting one first.');
        return;
      }
      await db.from('bookings').insert([{ item_id: state.currentItemId, start_date: start, end_date: end }]);
      loadAndRenderBookings(state.currentItemId);
      e.target.reset();
    });
  }
  const phoneForm = document.getElementById('phoneForm');
  if(phoneForm){
    phoneForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const phone = document.getElementById('acc-phone').value.trim();
      const { error } = await db.auth.updateUser({ data: { name: state.user.name, neighborhood: state.user.neighborhood, phone } });
      if(!error){ state.user.phone = phone; render(); }
    });
  }
  const cf = document.getElementById('createForm');
  if(cf){
    const editId = cf.dataset.editId;
    const existingItem = editId ? state.items.find(i=>i.id===editId) : null;
    let pendingPhoto = existingItem ? existingItem.photo : null;
    let pendingLat = existingItem ? existingItem.lat : null;
    let pendingLng = existingItem ? existingItem.lng : null;
    const photoInput = document.getElementById('c-photo');
    if(photoInput){
      photoInput.addEventListener('change', async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        document.getElementById('photoPreview').innerHTML = `<p style="color:var(--muted);font-size:13px;">Uploading photo...</p>`;
        try{
          const { previewDataUrl, url } = await processAndUploadPhoto(file, 900);
          pendingPhoto = url;
          document.getElementById('photoPreview').innerHTML = `<img src="${previewDataUrl}" style="max-width:100%;max-height:160px;border-radius:12px;object-fit:cover;">`;
        }catch(err){
          document.getElementById('photoPreview').innerHTML = `<p style="color:#c0392b;font-size:13px;">Upload failed — please try again.</p>`;
          console.error('photo upload failed', err);
        }
      });
    }
    window.captureLocation = function(){
      const statusEl = document.getElementById('locateStatus');
      if(!navigator.geolocation){ statusEl.textContent = 'Location not supported on this device.'; return; }
      statusEl.textContent = 'Getting your location...';
      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          // Fuzz the coordinates by ~300-500m so the exact address is never revealed publicly
          const jitter = () => (Math.random() - 0.5) * 0.008;
          pendingLat = pos.coords.latitude + jitter();
          pendingLng = pos.coords.longitude + jitter();
          statusEl.textContent = '✓ Approximate location saved (exact address not shown, for your privacy).';
          document.getElementById('locateBtn').textContent = '📍 Location saved — tap to update';
        },
        (err)=>{ statusEl.textContent = 'Could not get your location — you can still publish without it.'; },
        { enableHighAccuracy: false, timeout: 8000 }
      );
    };
    cf.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fields = {
        title: document.getElementById('c-title').value,
        description: document.getElementById('c-desc').value,
        category: document.getElementById('c-cat').value,
        subcategory: document.getElementById('c-subcat') ? document.getElementById('c-subcat').value || null : null,
        status: document.getElementById('c-status').value,
        price: document.getElementById('c-price').value || null,
        neighborhood: document.getElementById('c-hood').value,
        size: document.getElementById('c-size') ? document.getElementById('c-size').value || null : null,
        shoeSize: document.getElementById('c-shoe') ? document.getElementById('c-shoe').value || null : null,
        photo: pendingPhoto,
        lat: pendingLat, lng: pendingLng,
      };
      if(containsBlockedContent(fields.title) || containsBlockedContent(fields.description)){
        alert("This listing contains wording that's commonly used in scams (e.g. wire transfer, gift cards). Please rewrite it without that wording. If this is a mistake, contact us.");
        return;
      }
      if(existingItem){
        await updateItem(existingItem.id, fields, (existingItem.editCount||0)+1);
        await loadItems();
        openDetail(existingItem.id);
      } else {
        const item = { id: 'it_' + Date.now(), ...fields, postedBy: state.user.name, createdAt: Date.now() };
        await saveItem(item);
        await loadItems();
        goto('search');
      }
    });
  }
  const fCat = document.getElementById('fCat');
  const fStat = document.getElementById('fStat');
  const sInput = document.getElementById('searchInput');
  if(fCat) fCat.addEventListener('change', e=>{ state.filterCategory = e.target.value; state.filterSize=''; state.filterShoeSize=''; state.filterSubcategory=''; render(); });
  const fSubcat = document.getElementById('fSubcat');
  if(fSubcat) fSubcat.addEventListener('change', e=>{ state.filterSubcategory = e.target.value; render(); });
  if(fStat) fStat.addEventListener('change', e=>{ state.filterStatus = e.target.value; render(); });
  const fSize = document.getElementById('fSize');
  const fShoe = document.getElementById('fShoe');
  if(fSize) fSize.addEventListener('change', e=>{ state.filterSize = e.target.value; render(); });
  if(fShoe) fShoe.addEventListener('change', e=>{ state.filterShoeSize = e.target.value; render(); });
  if(sInput) sInput.addEventListener('input', e=>{
    state.searchQuery = e.target.value;
    const main = document.getElementById('mainContent');
    if(main) main.innerHTML = searchContent();
    bindScreenEvents();
  });
}

      const noticeBox = document.getElementById('authNotice');
      const newPass = document.getElementById('new-pass').value;
      const { error } = await db.auth.updateUser({ password: newPass });
      if(error){ errBox.textContent = error.message; errBox.style.display = 'block'; return; }
      noticeBox.textContent = 'Password updated! Redirecting...';
      noticeBox.style.display = 'block';
      setTimeout(()=>{ window.history.replaceState({}, '', window.location.pathname); state.screen = 'search'; render(); }, 1200);
    });
  }
});

render();
{
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  if(ref) state.referralCode = decodeURIComponent(ref);
}
loadItems().then(()=>{
  const params = new URLSearchParams(window.location.search);
  const sharedItemId = params.get('item');
  if(sharedItemId){
    window.history.replaceState({}, '', window.location.pathname);
    openDetail(sharedItemId);
  }
});
restoreSession();
handleCheckoutReturn();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
